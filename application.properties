# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8080}


# ==========================================
# DATABASE - MYSQL
# ==========================================
# Local default:
# jdbc:mysql://localhost:3306/memorylink_db
#
# On Render:
# DB_URL environment variable will override
# the local default value.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/memorylink_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# CORS
# ==========================================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
